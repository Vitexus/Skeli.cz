privacy.heading=Datenschutzerklärung
privacy.p1=Diese Website verarbeitet nur die für dein Konto notwendigen Daten (Benutzername, Passwort-Hash). Passwörter speichern wir als bcrypt-Hash. Kommentare sind öffentlich.
privacy.p2=Externe Plattformen (YouTube, Spotify) werden erst nach deiner Zustimmung geladen. Du kannst deine Zustimmung jederzeit ändern, indem du den Eintrag „cookieConsent“ im Browserspeicher löschst.
privacy.controller=Verantwortlicher: Skeli. Kontakt:
