gdpr.heading=Datenschutz
gdpr.title=DSGVO-Grundsätze
gdpr.intro=Deine Privatsphäre ist uns wichtig. Hier die wichtigsten Infos dazu, wie wir mit deinen Daten umgehen:
gdpr.email.label=E-Mail-Adresse:
