email.reset.body=Dobrý den,\n\nobdrželi jsme žádost o obnovení hesla k vašemu účtu na Skeli.cz.\n\nPokud chcete obnovit heslo, klikněte na následující odkaz (platí 30 minut):\n{link}\n\nPokud jste o obnovení hesla nežádali, ignorujte tento e-mail.\n\nS pozdravem,\nTým Skeli.cz
