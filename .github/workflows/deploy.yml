name: Deploy Skeli.cz

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pom.xml enforces JDK 21+; the runner's default JDK is older
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Detect Jetty-related changes
        id: jetty_changes
        run: |
          git fetch origin ${GITHUB_REF##*/}
          CHANGED_FILES=$(git diff --name-only HEAD origin/${GITHUB_REF##*/} || true)

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -E '(\.war$|WEB-INF|pom\.xml|src/main)' >/dev/null; then
            echo "restart_needed=true" >> $GITHUB_OUTPUT
          else
            echo "restart_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          RESTART_NEEDED: ${{ steps.jetty_changes.outputs.restart_needed }}
        run: |
          if [ "${GITHUB_REF##*/}" = "main" ]; then
            APP_NAME="test.skeli.cz"
          elif [ "${GITHUB_REF##*/}" = "production" ]; then
            APP_NAME="www.skeli.cz"
          else
            echo "❌ Unknown branch: ${GITHUB_REF##*/}"
            exit 1
          fi

          WAR_FILE="${APP_NAME}.war"
          echo "Building WAR for ${APP_NAME}..."

          # Build Java project (pokud používáš Maven)
          if [ -f pom.xml ]; then
            mvn -B clean package -DskipTests
            cp target/*.war $WAR_FILE
          fi

          echo "Uploading $WAR_FILE to $DEPLOY_HOST..."
          scp -o StrictHostKeyChecking=no $WAR_FILE $DEPLOY_USER@$DEPLOY_HOST:/tmp/$WAR_FILE

          # Migrations matching this commit (Flyway needs pom.xml + SQL, not just the WAR)
          tar -czf /tmp/skeli-flyway.tgz pom.xml src/main/resources/db/migration
          scp -o StrictHostKeyChecking=no /tmp/skeli-flyway.tgz $DEPLOY_USER@$DEPLOY_HOST:/tmp/skeli-flyway.tgz

          if [ "$APP_NAME" = "test.skeli.cz" ]; then
            WEB_ENV="/home/skeli/WWW/skeli.cz/web/.env"
          else
            WEB_ENV="/home/skeli/WWW/production.skeli.cz/web/.env"
          fi

          echo "Deploying to Jetty (Flyway first)..."
          ssh $DEPLOY_USER@$DEPLOY_HOST "
            set -euo pipefail
            MIGRATE_DIR=\$(mktemp -d /tmp/skeli-flyway.XXXXXX)
            tar -xzf /tmp/skeli-flyway.tgz -C \"\$MIGRATE_DIR\"
            rm /tmp/skeli-flyway.tgz
            if [ ! -f '$WEB_ENV' ]; then
              echo \"ERROR: missing $WEB_ENV for Flyway credentials\" >&2
              exit 1
            fi
            set -a
            # shellcheck disable=SC1090
            . '$WEB_ENV'
            set +a
            if [ -z \"\${DB_URL:-}\" ] || [ -z \"\${DB_USER:-}\" ]; then
              echo 'ERROR: DB_URL/DB_USER missing in $WEB_ENV' >&2
              exit 1
            fi
            echo 'Running Flyway migrations...'
            (cd \"\$MIGRATE_DIR\" && mvn -q -Dflyway.url=\"\$DB_URL\" -Dflyway.user=\"\$DB_USER\" -Dflyway.password=\"\${DB_PASS:-}\" flyway:migrate)
            rm -rf \"\$MIGRATE_DIR\"

            sudo cp /tmp/$WAR_FILE /var/lib/jetty9/webapps/$WAR_FILE
            rm /tmp/$WAR_FILE
            if [ '$RESTART_NEEDED' = 'true' ]; then
              echo 'Restarting Jetty...'
              sudo systemctl restart jetty9
            else
              echo 'Jetty restart not required.'
            fi
            sudo systemctl reload apache2
          "
