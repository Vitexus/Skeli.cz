name: Deploy Skeli.cz

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    # Forks have no deploy secrets
    if: github.repository == 'SkeliIT/Skeli.cz'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # pom.xml enforces JDK 21+; the runner's default JDK is older
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      # Fail fast before touching the server if the commit does not build
      - name: Build check
        run: mvn -B -q package -DskipTests

      - name: Setup SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          for name in DEPLOY_KEY DEPLOY_HOST DEPLOY_USER; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)"
              exit 1
            fi
          done
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Branch → environment mapping (Jetty runs via `mvn jetty:run` from a git checkout)
          #   main       → https://test.skeli.cz  (skeli-test.service, port 8082)
          #   production → https://skeli.cz       (skeli-production.service, port 8083)
          case "$BRANCH" in
            main)
              SITE_URL="https://test.skeli.cz"
              APP_DIR="/home/skeli/WWW/skeli.cz/web"
              SERVICE="skeli-test.service"
              ;;
            production)
              SITE_URL="https://skeli.cz"
              APP_DIR="/home/skeli/WWW/production.skeli.cz/web"
              SERVICE="skeli-production.service"
              ;;
            *)
              echo "::error::Unknown branch: $BRANCH (expected main or production)"
              exit 1
              ;;
          esac

          echo "Deploying $BRANCH ($GITHUB_SHA) → $SITE_URL ..."
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "
            set -euo pipefail
            cd '$APP_DIR'

            # Keep any manual edits on the server as a stash instead of losing them
            if [ -n \"\$(git status --porcelain --untracked-files=no)\" ]; then
              git stash push -m \"pre-deploy \$(date -u +%Y%m%dT%H%M%SZ)\"
            fi
            git fetch --quiet origin '$BRANCH'
            git reset --hard '$GITHUB_SHA'

            if [ ! -f .env ]; then
              echo \"ERROR: missing $APP_DIR/.env for Flyway credentials\" >&2
              exit 1
            fi
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            if [ -z \"\${DB_URL:-}\" ] || [ -z \"\${DB_USER:-}\" ]; then
              echo 'ERROR: DB_URL/DB_USER missing in .env' >&2
              exit 1
            fi
            echo 'Running Flyway migrations...'
            mvn -q -Dflyway.url=\"\$DB_URL\" -Dflyway.user=\"\$DB_USER\" -Dflyway.password=\"\${DB_PASS:-}\" flyway:migrate

            echo 'Restarting $SERVICE ...'
            sudo /bin/systemctl restart '$SERVICE'
            echo \"Deployed $BRANCH → $SITE_URL\"
          "
